<!DOCTYPE html>
<html lang="mr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>केंद्रप्रमुख शाळा भेट व संचमान्यता पट पडताळणी प्रपत्र</title>
  <link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #1e40af;
      --primary-light: #3b82f6;
      --primary-subtle: #eff6ff;
      --secondary: #0f766e;
      --accent: #f59e0b;
      --bg-color: #f1f5f9;
      --card-bg: #ffffff;
      --border-color: #cbd5e1;
      --text-main: #0f172a;
      --text-muted: #475569;
      --danger: #dc2626;
      --success: #16a34a;
    }

    * {
      box-sizing: border-box;
      font-family: 'Mukta', 'Segoe UI', sans-serif;
    }

    body {
      background: var(--bg-color);
      margin: 0;
      padding: 12px;
      color: var(--text-main);
      -webkit-font-smoothing: antialiased;
    }

    .form-container {
      max-width: 900px;
      margin: 10px auto;
      background: var(--card-bg);
      padding: 24px 28px;
      border-radius: 12px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.04);
      border: 1px solid #e2e8f0;
    }

    .header-section {
      text-align: center;
      padding-bottom: 16px;
      border-bottom: 2px dashed #94a3b8;
      margin-bottom: 20px;
    }

    .header-badge {
      display: inline-block;
      background: #e0e7ff;
      color: #3730a3;
      font-size: 13px;
      font-weight: 700;
      padding: 4px 14px;
      border-radius: 9999px;
      margin-bottom: 8px;
    }

    .header-section h2 {
      margin: 4px 0;
      font-size: 22px;
      font-weight: 700;
      color: var(--primary);
    }

    .header-section h3 {
      margin: 0;
      font-size: 15px;
      font-weight: 600;
      color: var(--text-muted);
    }

    .section-title {
      font-size: 15px;
      font-weight: 700;
      margin-top: 20px;
      margin-bottom: 12px;
      background: linear-gradient(90deg, var(--primary-subtle) 0%, rgba(239, 246, 255, 0.2) 100%);
      color: var(--primary);
      padding: 7px 12px;
      border-left: 4px solid var(--primary);
      border-radius: 0 6px 6px 0;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      margin-bottom: 12px;
    }

    .form-group label {
      font-size: 13.5px;
      font-weight: 600;
      color: #334155;
      margin-bottom: 4px;
    }

    .form-group input, 
    .form-group textarea, 
    .form-group select {
      padding: 8px 12px;
      font-size: 14px;
      border: 1.5px solid var(--border-color);
      border-radius: 6px;
      outline: none;
      background-color: #fff;
      transition: all 0.2s ease;
      width: 100%;
    }

    .form-group select {
      font-weight: 600;
      color: var(--primary);
      cursor: pointer;
    }
